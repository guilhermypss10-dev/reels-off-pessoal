
name: Compilar Reels Off para iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        working-directory: ReelsOff
        run: xcodegen generate

      - name: Compilar aplicativo
        working-directory: ReelsOff
        run: |
          xcodebuild \
            -scheme ReelsOff \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Criar arquivo IPA
        working-directory: ReelsOff
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ReelsOff.app Payload/
          zip -r ReelsOff.ipa Payload/

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: ReelsOff-iPhone
          path: ReelsOff/ReelsOff.ipa
